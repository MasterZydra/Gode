name: Build Desktop Packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            fyne_os: linux
            artifact: gode-linux
          - name: macOS
            runner: macos-latest
            fyne_os: darwin
            artifact: gode-macos
          - name: Windows
            runner: windows-latest
            fyne_os: windows
            artifact: gode-windows

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # ------------------------------------------------------------
      # Linux dependencies
      # ------------------------------------------------------------
      - name: Install Linux Fyne dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libgl1-mesa-dev \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev

      # ------------------------------------------------------------
      # Windows / MSYS2 / MinGW64
      # ------------------------------------------------------------
      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-go

      - name: Add MinGW64 to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

      - name: Configure Windows CGO
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "CGO_ENABLED=1" >> $env:GITHUB_ENV
          echo "CC=x86_64-w64-mingw32-gcc" >> $env:GITHUB_ENV
          echo "CXX=x86_64-w64-mingw32-g++" >> $env:GITHUB_ENV

      # ------------------------------------------------------------
      # Go
      # ------------------------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # ------------------------------------------------------------
      # Fyne tooling
      # ------------------------------------------------------------
      - name: Install Fyne packaging tool
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Add Go tools to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------
      # Verify Windows compiler
      # ------------------------------------------------------------
      - name: Check Windows compiler
        if: runner.os == 'Windows'
        shell: bash
        run: |
          gcc --version
          go version
          go env CGO_ENABLED
          go env CC

      # ------------------------------------------------------------
      # Tests
      # ------------------------------------------------------------
      - name: Run tests
        run: go test ./...

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build project
        run: go build ./...

      # ------------------------------------------------------------
      # Package
      # ------------------------------------------------------------
      - name: Package application
        shell: bash
        run: |
          fyne package \
            -os ${{ matrix.fyne_os }} \
            -src cmd/gode \
            -name gode \
            -app-id com.gode.editor \
            -icon "${{ github.workspace }}/assets/gode.png" \
            -release

      # ------------------------------------------------------------
      # Upload
      # ------------------------------------------------------------
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ runner.os == 'Linux' && '*.tar.xz' || ''}}
            ${{ runner.os == 'Windows' && '*.exe' || '' }}
            ${{ runner.os == 'macOS' && '*.app' || '' }}
            *.tar.gz
            *.zip
          if-no-files-found: error
